<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141110" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="StudyBuddy — an AI-powered study tracker and revision assistant. Track what you learn, turn documents into notes, and revise at the right time."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StudyBuddy</title>

    <!--
      Applied before first paint so a dark-mode user never sees a white flash.
      theme is 'light' | 'dark' | 'system' (see src/context/ThemeContext.tsx).
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('studybuddy.theme') || 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* private mode — fall back to light */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
